gradle.beforeProject { target ->
    if (target.path != ':okhttp') return
    target.tasks.register('warmVerifierRuntime') {
        doLast {
            target.configurations.jvmTestRuntimeClasspath.incoming.artifactView {
                componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            }.files.each { file ->
                if (!file.exists()) throw new GradleException("Missing external runtime dependency: $file")
            }
        }
    }
}
